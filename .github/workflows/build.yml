name: Build and Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Show coverage in the run summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9; bm+=$6; bc+=$7}
              END {
                printf "### Test coverage (JaCoCo)\n\n";
                printf "- Line coverage: **%.1f%%** (%d of %d lines)\n", 100*c/(m+c), c, m+c;
                printf "- Branch coverage: **%.1f%%** (%d of %d branches)\n", 100*bc/(bm+bc), bc, bm+bc
              }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No JaCoCo report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/site/jacoco/

      - name: Generate Javadoc
        run: mvn -B javadoc:javadoc

      - name: Upload Javadoc
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: target/site/apidocs/

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            target/*.jar
            target/surefire-reports/